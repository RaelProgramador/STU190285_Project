<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — FireGuitar</title>
    <script src="/assets/js/core/theme-init.js"></script>
    <link rel="icon" href="/assets/images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/pages/dashboard.css">
</head>
<body>
    <div id="app-header"></div>

    <main id="main">
        <section class="page-hero">
            <div class="container dash-hero" id="dash-hero">
                <div>
                    <span class="eyebrow">My dashboard</span>
                    <h1 id="greeting">Welcome back</h1>
                    <p class="lead">Here's how your guitar journey is going.</p>
                </div>
            </div>
        </section>

        <section class="section-sm">
            <div class="container stack dash-content">
                <div class="grid grid-4" id="stat-cards">
                    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
                </div>

                <div class="dash-grid">
                    <div class="stack">
                        <div id="continue-card"><div class="skeleton"></div></div>

                        <section class="card">
                            <div class="card-header">
                                <h2 class="card-title">Your learning path</h2>
                                <a class="link-btn" href="/index.html#learning-path">View roadmap</a>
                            </div>
                            <div id="stage-list" class="stage-progress-list"><div class="skeleton"></div></div>
                        </section>
                    </div>

                    <div class="stack">
                        <section class="card">
                            <div class="card-header">
                                <h2 class="card-title">This week</h2>
                                <span class="badge" id="week-total"></span>
                            </div>
                            <div id="weekly-chart" class="weekly-chart"></div>
                        </section>

                        <section class="card">
                            <div class="card-header">
                                <h2 class="card-title">Goals</h2>
                                <a class="link-btn" href="/goals.html">Manage</a>
                            </div>
                            <div id="goals-preview"><div class="skeleton"></div></div>
                        </section>

                        <section class="card">
                            <h2 class="card-title recent-title">Recently completed</h2>
                            <div id="recent-list"></div>
                        </section>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="app-footer"></div>
    <script type="module" src="/assets/js/pages/dashboard.js"></script>
</body>
</html>
